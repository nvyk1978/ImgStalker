name: Build ImgStalker

on:
  workflow_dispatch:
  push:
    paths:
      - 'source.zip'
      - '.github/workflows/ImgStalker.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Extract source.zip
        shell: bash
        run: |
          rm -rf work
          mkdir -p work
          unzip -q -o source.zip -d work
          test -f work/settings.gradle
          test -f work/app/build.gradle

      - name: Build release APK
        working-directory: work
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename APK with version
        id: package
        shell: bash
        run: |
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" work/app/build.gradle | head -1)
          test -n "$VERSION"
          OUT="ImgStalker-v${VERSION}.apk"
          cp work/app/build/outputs/apk/release/app-release.apk "$OUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ImgStalker-v${{ steps.package.outputs.version }}
          path: ${{ steps.package.outputs.apk }}
          if-no-files-found: error
          retention-days: 30
